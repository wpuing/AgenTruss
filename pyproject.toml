[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentruss"
version = "0.2.0"
description = "Enterprise AI agent platform scaffold with durable storage and LangGraph workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pyjwt>=2.9",
  "pyyaml>=6",
  "httpx>=0.27",
  "pytest>=8",
  "cryptography>=42",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "redis>=5.0",
  # Keep above known-fixed floors for pip-audit (2026-10 CI).
  "langgraph>=1.0.10",
  "langgraph-checkpoint>=4.1.1",
  "langgraph-checkpoint-postgres>=3.1.3",
  "langchain-core>=1.2.22",
  # Transitive floors: urllib3/werkzeug CVEs break CI pip-audit (public 1f62400).
  "urllib3>=2.8.0",
  "werkzeug>=3.1.9",
]

[project.optional-dependencies]
agentscope = [
  "agentscope==2.0.10",
]
# Object / vector extras — install when wiring real MinIO / Milvus (phase 5).
storage = [
  "minio>=7.2",
  "pymilvus>=2.4",
]
rag = [
  "llama-index-core>=0.10.0",
]
dev = [
  "ruff>=0.8,<1",
  # CI installs latest mypy; keep floor compatible with full-app gate (see Phase5.25).
  "mypy>=1.13,<3",
]
e2e = [
  "playwright>=1.40",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/admin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Scoped quality gates for progressive DDD modules (not whole-repo strict yet).
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = false
pretty = true
# CI / local: `mypy app` (full package). ignore_missing_imports covers AgentScope/Milvus stubs gaps.
# Do not treat follow-imports=skip as a substitute for full-app checking.
